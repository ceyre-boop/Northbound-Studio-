<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"
     aria-label="A shopfront window with Buddy waving in front of it">
  <title>The website is the front of it</title>
  <desc>Frame one of three. Drawn as solid silhouettes with no thin strokes,
  because these shapes are sampled into a point cloud and a hairline does not
  survive being made of dots. Fill only, high contrast, one clear outline.</desc>

  <g fill="#ffffff">
    <!-- awning -->
    <path d="M26 40 L174 40 L166 58 L34 58 Z"/>
    <!-- shopfront frame, thick enough to read as dots -->
    <path d="M30 62 H170 V166 H30 Z M44 76 V152 H156 V76 Z"/>
    <!-- window glazing bar -->
    <rect x="98" y="76" width="5" height="76"/>
    <!-- door -->
    <rect x="112" y="112" width="34" height="40"/>
    <!-- sign board over the door -->
    <rect x="56" y="88" width="30" height="9" rx="4"/>
    <rect x="56" y="104" width="22" height="6" rx="3"/>

    <!-- buddy, out front, waving -->
    <g transform="translate(150 118) scale(0.30)">
      <circle cx="100" cy="112" r="66"/>
      <rect x="94" y="14" width="12" height="36" rx="6"/>
      <path d="M100 0 L84 22 L100 44 L116 22 Z"/>
      <path d="M74 172 L56 200 L80 200 L90 176 Z"/>
      <path d="M126 172 L144 200 L120 200 L110 176 Z"/>
      <!-- the raised arm -->
      <g transform="rotate(-22 162 96)">
        <rect x="152" y="60" width="20" height="54" rx="10"/>
        <circle cx="162" cy="54" r="14"/>
      </g>
    </g>
  </g>

  <!-- the eyes and mouth are cut OUT of the body, so the silhouette keeps them
       when the shape is rebuilt from points -->
  <g fill="#000000">
    <circle cx="173.5" cy="148" r="2.6"/>
    <circle cx="187" cy="148" r="2.6"/>
    <path d="M172 156 Q180 161 188 156" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
