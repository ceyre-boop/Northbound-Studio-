<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Northbound Studio — web design and development, live in 48 hours">
  <title>Northbound Studio — social card</title>
  <defs>
    <radialGradient id="og-ambient" cx="72%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#0d1a1f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="55%" stop-color="#6fe3ff"/>
      <stop offset="100%" stop-color="#35b8de"/>
    </linearGradient>
    <linearGradient id="og-shard-rim" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="#6fe3ff"/>
      <stop offset="100%" stop-color="#35b8de" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="og-shard-fill" cx="72%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#0b1013"/>
      <stop offset="55%" stop-color="#020304"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="og-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#og-ambient)"/>

  <!-- eyebrow -->
  <text x="90" y="108" font-family="'Instrument Sans', system-ui, sans-serif" font-size="18" letter-spacing="4" fill="#9a9ba3">GRAND LEDGE, MI &#183; LIVE IN 48 HOURS</text>

  <!-- The Fragment, scaled -->
  <g transform="translate(90,150) scale(1.05)">
    <path d="M66 8 L88 44 L68 52 L94 86 L58 152" fill="none" stroke="#6fe3ff" stroke-width="6" opacity="0.3" filter="url(#og-glow)"/>
    <path d="M66 8 L88 44 L68 52 L94 86 L58 152 L40 92 L56 72 L32 40 Z" fill="url(#og-shard-fill)"/>
    <path d="M58 152 L40 92 L56 72 L32 40 L66 8" fill="none" stroke="#1c2226" stroke-width="1.5"/>
    <path d="M66 8 L88 44 L68 52 L94 86 L58 152" fill="none" stroke="url(#og-shard-rim)" stroke-width="2"/>
    <path d="M66 8 L88 44" fill="none" stroke="#ff7ad1" stroke-width="1" opacity="0.45" style="mix-blend-mode:screen" transform="translate(1.1,0.7)"/>
  </g>

  <!-- wordmark, bespoke letterforms, scaled -->
  <g transform="translate(240,196) scale(1.25)" fill="none" stroke="url(#og-rim)" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
    <g transform="translate(0,0)"><path d="M0,64 L0,0 L40,64 L40,0"/></g>
    <g transform="translate(58,0)"><ellipse cx="20" cy="32" rx="16" ry="30"/></g>
    <g transform="translate(116,0)"><path d="M0,0 L0,64 M0,0 L21,0 A15,15 0 0 1 21,30 L0,30 M9,30 L40,64"/></g>
    <g transform="translate(174,0)"><path d="M0,0 L40,0 M20,0 L20,64"/></g>
    <g transform="translate(232,0)"><path d="M0,0 L0,64 M40,0 L40,64 M0,32 L40,32"/></g>
    <g transform="translate(290,0)"><path d="M0,0 L0,64 M0,0 L19,0 A14,14 0 0 1 19,28 L0,28 M0,28 L21,28 A18,18 0 0 1 21,64 L0,64"/></g>
    <g transform="translate(348,0)"><ellipse cx="20" cy="32" rx="16" ry="30"/></g>
    <g transform="translate(406,0)"><path d="M0,0 L0,42 A20,20 0 0 0 40,42 L40,0"/></g>
    <g transform="translate(464,0)"><path d="M0,64 L0,0 L40,64 L40,0"/></g>
    <g transform="translate(522,0)"><path d="M0,0 L0,64 M0,0 L13,0 A27,32 0 0 1 13,64 L0,64"/></g>
  </g>

  <!-- tagline -->
  <text x="90" y="440" font-family="'Instrument Sans', system-ui, sans-serif" font-size="34" fill="#9a9ba3">Fast, honest websites for small businesses.</text>
  <text x="90" y="482" font-family="'Instrument Sans', system-ui, sans-serif" font-size="34" fill="#9a9ba3">Text us when something breaks.</text>

  <!-- footer -->
  <text x="90" y="560" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" letter-spacing="2" fill="#64656e">NORTHBOUND-DEV.COM</text>
  <text x="1110" y="560" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" letter-spacing="2" fill="#64656e">FROM $1,500 &#183; 48HR LAUNCH</text>
</svg>
