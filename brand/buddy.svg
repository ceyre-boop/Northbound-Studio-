<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Buddy, the Northbound presence">
  <title>Buddy — a fragment that has come loose</title>
  <desc>Buddy is not a mascot with a face. He is a small piece of the same light as the mark: a shard with a living core, trailed by drifting particles. Moods are driven by the core's brightness and colour temperature, the shard's tilt, and the length of its trail — never by eyes or a mouth. Layer IDs are built for that: buddy-core (breathing/mood), buddy-fragment (tilt/orientation), buddy-trail (motion state), buddy-glow (ambient halo).</desc>

  <defs>
    <radialGradient id="buddy-core-fill" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="var(--color-ion-500, #6fe3ff)"/>
      <stop offset="100%" stop-color="var(--color-ion-600, #35b8de)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="buddy-shard-fill" cx="60%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#0b1013"/>
      <stop offset="60%" stop-color="#030405"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="buddy-rim" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="var(--color-ion-500, #6fe3ff)"/>
      <stop offset="100%" stop-color="var(--color-ion-600, #35b8de)" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="buddy-blur-lg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="buddy-blur-sm" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ambient halo: the beacon this creature is a piece of -->
  <g id="buddy-glow">
    <circle cx="104" cy="118" r="70" fill="var(--color-ion-soft, rgba(111,227,255,0.12))" filter="url(#buddy-blur-lg)"/>
  </g>

  <!-- trail: drifting embers peeling off behind — this is what carries "motion" states -->
  <g id="buddy-trail">
    <circle cx="70" cy="176" r="3.5" fill="var(--color-ion-500, #6fe3ff)" opacity="0.5"/>
    <circle cx="58" cy="192" r="2.2" fill="var(--color-ion-500, #6fe3ff)" opacity="0.32"/>
    <circle cx="49" cy="206" r="1.3" fill="var(--color-ion-500, #6fe3ff)" opacity="0.18"/>
    <circle cx="92" cy="182" r="1.6" fill="var(--color-fringe-500, #ff7ad1)" opacity="0.22"/>
  </g>

  <!-- the fragment: a small, asymmetric shard, mostly void -->
  <g id="buddy-fragment">
    <path d="M104 40 L128 78 L110 88 L120 132 L92 168 L74 116 L88 98 L70 74 Z" fill="url(#buddy-shard-fill)"/>
    <!-- unlit face, barely visible -->
    <path d="M92 168 L74 116 L88 98 L70 74 L104 40" fill="none" stroke="#1c2226" stroke-width="1.25"/>
    <!-- lit face -->
    <path d="M104 40 L128 78 L110 88 L120 132 L92 168" fill="none" stroke="url(#buddy-rim)" stroke-width="2" stroke-linejoin="miter"/>
    <!-- fringe, single brightest edge only -->
    <path d="M104 40 L128 78" fill="none" stroke="var(--color-fringe-500, #ff7ad1)" stroke-width="1"
          opacity="0.4" style="mix-blend-mode: screen" transform="translate(1,0.6)"/>
  </g>

  <!-- core: the "presence" — this is the single element that breathes / shifts mood -->
  <g id="buddy-core">
    <circle cx="100" cy="96" r="15" fill="url(#buddy-core-fill)" filter="url(#buddy-blur-sm)"/>
    <circle cx="100" cy="96" r="4.5" fill="#ffffff"/>
  </g>
</svg>
