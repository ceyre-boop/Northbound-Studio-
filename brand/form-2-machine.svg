<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"
     aria-label="Buddy turning a gear, with a clock, an envelope and a coin around it">
  <title>The part behind it</title>
  <desc>Frame two of three. The machinery the website is the front of: booking,
  follow-up and payments, drawn as one gear with a clock, an envelope and a coin
  around it. Solid fills only — these shapes get sampled into a point cloud.</desc>

  <g fill="#ffffff">
    <!-- the big gear: twelve teeth on a ring -->
    <g transform="translate(86 104)">
      <g>
        <rect x="-7" y="-62" width="14" height="18" rx="2"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(30)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(60)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(90)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(120)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(150)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(180)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(210)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(240)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(270)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(300)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(330)"/>
      </g>
      <!-- ring: outer circle with the centre punched out -->
      <path d="M0 -48 A48 48 0 1 1 0 48 A48 48 0 1 1 0 -48 Z
               M0 -26 A26 26 0 1 0 0 26 A26 26 0 1 0 0 -26 Z" fill-rule="evenodd"/>
    </g>

    <!-- clock, upper right: booking -->
    <g transform="translate(160 44)">
      <path d="M0 -26 A26 26 0 1 1 0 26 A26 26 0 1 1 0 -26 Z
               M0 -17 A17 17 0 1 0 0 17 A17 17 0 1 0 0 -17 Z" fill-rule="evenodd"/>
      <rect x="-3" y="-14" width="6" height="16" rx="3"/>
      <rect x="-3" y="-3" width="14" height="6" rx="3"/>
    </g>

    <!-- envelope, lower right: the follow-up -->
    <g transform="translate(158 148)">
      <path d="M-28 -18 H28 V18 H-28 Z M-28 -18 L0 4 L28 -18" fill-rule="evenodd"/>
      <path d="M-24 -14 L0 4 L24 -14 L24 -12 L0 8 L-24 -12 Z"/>
    </g>

    <!-- coin, lower left: payments -->
    <g transform="translate(38 160)">
      <path d="M0 -20 A20 20 0 1 1 0 20 A20 20 0 1 1 0 -20 Z
               M0 -12 A12 12 0 1 0 0 12 A12 12 0 1 0 0 -12 Z" fill-rule="evenodd"/>
      <rect x="-2.5" y="-9" width="5" height="18" rx="2"/>
    </g>

    <!-- buddy, turning the handle -->
    <g transform="translate(34 62) scale(0.26)">
      <circle cx="100" cy="112" r="66"/>
      <rect x="94" y="14" width="12" height="36" rx="6"/>
      <path d="M100 0 L84 22 L100 44 L116 22 Z"/>
      <path d="M74 172 L56 200 L80 200 L90 176 Z"/>
      <path d="M126 172 L144 200 L120 200 L110 176 Z"/>
      <!-- arm reaching across to the gear -->
      <g transform="rotate(28 160 110)">
        <rect x="150" y="92" width="20" height="58" rx="10"/>
        <circle cx="160" cy="150" r="14"/>
      </g>
    </g>
  </g>

  <g fill="#000000">
    <circle cx="49" cy="88" r="2.6"/>
    <circle cx="60.5" cy="88" r="2.6"/>
    <path d="M48 95 Q54.5 100 61 95" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
