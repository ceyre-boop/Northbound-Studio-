<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" role="img" aria-label="Northbound Studio mark: The Fragment">
  <title>Northbound — The Fragment</title>
  <desc>An irregular shard, almost entirely void, made visible only by light hitting one face. The unlit face recedes back into black. A thin violet-magenta fringe traces the brightest edge, the way a lens separates colour at a hard highlight. Never a flat fill.</desc>

  <defs>
    <radialGradient id="frag-body" cx="72%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#0b1013"/>
      <stop offset="55%" stop-color="#020304"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="frag-rim-lit" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="35%" stop-color="var(--color-ion-500, #6fe3ff)"/>
      <stop offset="100%" stop-color="var(--color-ion-600, #35b8de)" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="frag-rim-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2f33" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="frag-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
  </defs>

  <!-- ambient glow behind the lit edge, sells "light in the dark" -->
  <path d="M66 8 L88 44 L68 52 L94 86 L58 152" fill="none" stroke="var(--color-ion-500, #6fe3ff)"
        stroke-width="5" opacity="0.35" filter="url(#frag-glow)"/>

  <!-- the fragment: almost entirely void -->
  <path d="M66 8 L88 44 L68 52 L94 86 L58 152 L40 92 L56 72 L32 40 Z" fill="url(#frag-body)"/>

  <!-- unlit face: barely there, recedes into black -->
  <path d="M58 152 L40 92 L56 72 L32 40 L66 8" fill="none" stroke="url(#frag-rim-shadow)" stroke-width="1.5"/>

  <!-- lit face: where the light actually is -->
  <path d="M66 8 L88 44 L68 52 L94 86 L58 152" fill="none" stroke="url(#frag-rim-lit)" stroke-width="1.75" stroke-linejoin="miter"/>

  <!-- chromatic fringe: only at the single brightest edge, additive, never a fill -->
  <path d="M66 8 L88 44" fill="none" stroke="var(--color-fringe-500, #ff7ad1)" stroke-width="1"
        opacity="0.45" style="mix-blend-mode: screen" transform="translate(1.1,0.7)"/>
</svg>
