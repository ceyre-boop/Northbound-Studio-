<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Got it — Northbound Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F2228">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<!--
  Where the quote form lands when it was posted without JavaScript. With
  JavaScript, js/quote.js shows the same words in place and nobody sees this.
  Self-contained on purpose: it borrows the site's fonts and colours but none
  of its scripts, so it cannot fail in any of the ways the page it came from
  might have.
-->
<style>
  @font-face { font-family: 'Fraunces'; src: url('fonts/fraunces.woff2') format('woff2'); font-weight: 400 600; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 400 600; font-display: swap; }
  /* The dream rebuild's ground, ink and one accent (css/dream.css). */
  :root { --ink: #1F2228; --paper: #ECEEF2; --paper-dim: #B4B9C2; --aurora: #9DBAF7; }
  html { background: var(--ink); }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 48px clamp(20px, 5vw, 72px);
    box-sizing: border-box;
    color: var(--paper);
    font: 1.05rem/1.55 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  main { max-width: 34rem; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.05; margin: 0 0 20px; }
  p { color: var(--paper-dim); margin: 0 0 16px; }
  a { color: var(--aurora); }
  .back {
    display: inline-block;
    margin-top: 12px;
    padding: 14px 22px;
    min-height: 44px;
    box-sizing: border-box;
    border-radius: 999px;
    background: var(--aurora);
    color: var(--ink);
    font-weight: 500;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>Got it.</h1>
  <p>We'll get back to you within one business day. A copy of what you sent is on its way to your inbox.</p>
  <p>If it can't wait, email <a href="mailto:hello@northbound-dev.com">hello@northbound-dev.com</a>.</p>
  <a class="back" href="/">Back to Northbound</a>
</main>
</body>
</html>
